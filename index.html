<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recipe Box">
<meta name="theme-color" content="#fbf3e7">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Recipe Box</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Karla:wght@400;500;700&display=swap');

  :root{
    --card: #fffaf3;
    --paper: #fbf3e7;
    --ink: #3a2e26;
    --ink-soft: #7a6a5c;
    --line: #e3d3bd;
    --accent: #b5533c;
    --accent-soft: #f0dcc9;
    --tab-bg: #efe1cb;
    --check: #6d8b6b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding-top: env(safe-area-inset-top);
    -webkit-text-size-adjust: 100%;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(58,46,38,0.06) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    font-family: 'Karla', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    padding: 28px 20px 16px;
    text-align: center;
  }

  header .kicker {
    font-family: 'Karla', sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
  }

  header h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 700;
    font-size: 34px;
    margin: 4px 0 2px;
    letter-spacing: -0.01em;
  }

  header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .add-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    margin: 18px 0 22px;
    padding: 13px;
    background: var(--ink);
    color: var(--card);
    border: none;
    border-radius: 10px;
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  .add-btn:active { transform: scale(0.98); opacity: 0.9; }

  .util-row {
    display: flex;
    gap: 10px;
    margin: 0 0 22px;
  }
  .util-row.spaced { margin-top: 20px; }
  .util-btn {
    flex: 1;
    padding: 11px 10px;
    background: transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: 'Karla', sans-serif;
    font-weight: 700;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }
  .util-btn:active {
    transform: scale(0.98);
    background: var(--accent-soft);
    color: var(--ink);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(22px + env(safe-area-inset-bottom));
    transform: translate(-50%, 12px);
    max-width: calc(100% - 40px);
    padding: 11px 18px;
    background: var(--ink);
    color: var(--card);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty .big { font-size: 40px; margin-bottom: 10px; }
  .empty p { font-family: 'Fraunces', serif; font-size: 18px; margin: 0 0 4px; color: var(--ink); }
  .empty span { font-size: 13px; }

  .recipe-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(58,46,38,0.05);
  }

  .recipe-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 18px;
    cursor: pointer;
  }

  .recipe-head-text { flex: 1; min-width: 0; }

  .recipe-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 20px;
    margin: 0 0 3px;
    color: var(--ink);
  }

  .recipe-meta {
    font-size: 12px;
    color: var(--ink-soft);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .chevron {
    font-size: 18px;
    color: var(--accent);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .recipe-card.open .chevron { transform: rotate(180deg); }

  .recipe-body {
    display: none;
    padding: 0 18px 20px;
    border-top: 1px dashed var(--line);
  }
  .recipe-card.open .recipe-body { display: block; }

  .tabs {
    display: flex;
    gap: 6px;
    margin: 16px 0 14px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 10px;
    background: var(--tab-bg);
    border: none;
    border-radius: 8px;
    font-family: 'Karla', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff8f0;
  }

  .pane { display: none; }
  .pane.active { display: block; }

  .desc {
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 14px;
    font-style: italic;
  }

  .ing-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .ing-row:last-child { border-bottom: none; }

  .checkbox {
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 1px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
  }
  .checkbox.checked {
    background: var(--check);
    border-color: var(--check);
    color: #fff;
    font-size: 12px;
  }
  .ing-text.checked {
    text-decoration: line-through;
    color: var(--ink-soft);
  }

  .step-row {
    display: flex;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .step-row:last-child { border-bottom: none; }
  .step-num {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    color: var(--accent);
    font-size: 15px;
    width: 20px;
    flex-shrink: 0;
  }
  .step-text { font-size: 14px; line-height: 1.5; }
  .step-title { font-weight: 700; display: block; margin-bottom: 2px; }

  .notes-box {
    background: var(--accent-soft);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink);
  }
  .notes-box .lbl {
    font-weight: 700;
    text-transform: uppercase;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--accent);
    display: block;
    margin-bottom: 4px;
  }

  .card-actions {
    display: flex;
    justify-content: flex-end;
    padding-top: 12px;
    margin-top: 4px;
  }
  .del-btn {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  .del-btn:hover { color: var(--accent); }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(58,46,38,0.45);
    z-index: 50;
    align-items: flex-end;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    width: 100%;
    max-height: 88vh;
    overflow-y: auto;
    border-radius: 18px 18px 0 0;
    padding: 22px 20px 30px;
  }
  .modal h2 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    margin: 0 0 16px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 11.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 700;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .field input, .field textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: 'Karla', sans-serif;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
  }
  .field textarea { min-height: 90px; resize: vertical; font-family: 'Karla', monospace; line-height: 1.5; }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 4px; }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .btn-primary, .btn-secondary {
    flex: 1;
    padding: 12px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff8f0; }
  .btn-secondary { background: var(--tab-bg); color: var(--ink); }
  .modal-actions.stack { flex-direction: column; gap: 8px; }
  .modal-actions.stack button { flex: none; width: 100%; }
  .modal-note {
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-soft);
    margin: 0 0 16px;
  }
  .modal-note strong { color: var(--ink); }

  ::selection { background: var(--accent-soft); }

  .nav-tabs {
    display: flex;
    gap: 6px;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }
  .nav-tab {
    flex: 1;
    padding: 11px 10px;
    background: var(--tab-bg);
    border: none;
    border-radius: 9px 9px 0 0;
    font-family: 'Karla', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .nav-tab.active {
    background: var(--card);
    color: var(--ink);
    box-shadow: 0 -1px 0 var(--line) inset;
  }

  .view { display: none; }
  .view.active { display: block; }

  .pick-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
  }
  .pick-row:last-child { border-bottom: none; }
  .pick-row .rtitle { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; }
  .pick-row .rcount { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }

  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 20px 0 8px;
  }

  .shop-group {
    margin-bottom: 18px;
  }
  .shop-group-title {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--accent);
    margin: 0 0 6px;
  }

  .shop-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-soft);
    font-size: 13.5px;
  }

  .save-status {
    display: none;
    margin: 14px 0 0;
    padding: 10px 12px;
    background: #f7e4d8;
    border: 1px solid #e0b89e;
    border-radius: 9px;
    font-size: 12.5px;
    line-height: 1.45;
    color: #8a4a2c;
  }
</style>
</head>
<body>

<header>
  <div class="kicker">Andes's Kitchen</div>
  <h1>Recipe Box</h1>
  <p>Every recipe you've saved, in one place</p>
</header>

<div class="nav-tabs">
  <button class="nav-tab active" id="nav-recipes" onclick="switchView('recipes')">My Recipes</button>
  <button class="nav-tab" id="nav-shopping" onclick="switchView('shopping')">Shopping List</button>
</div>

<div class="container">
  <div id="saveStatus" class="save-status"></div>

  <div class="view active" id="view-recipes">
    <button class="add-btn" onclick="openAddModal()">+ Add a recipe</button>
    <div class="util-row">
      <button class="util-btn" onclick="exportRecipes()">Export backup</button>
      <button class="util-btn" onclick="openImportPicker()">Import backup</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json"
           style="display:none" onchange="handleImportFile(this)">
    <div id="recipeList"></div>
  </div>

  <div class="view" id="view-shopping">
    <div class="section-label">Include recipes</div>
    <div id="pickList"></div>
    <div class="section-label" style="margin-top:24px;">Combined list</div>
    <div id="shoppingList"></div>
    <div class="util-row spaced">
      <button class="util-btn" onclick="exportShoppingList()">Export list</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Add a recipe</h2>
    <div class="field">
      <label>Title</label>
      <input type="text" id="f-title" placeholder="e.g. Rendang Daging">
    </div>
    <div class="field">
      <label>Short description (optional)</label>
      <input type="text" id="f-desc" placeholder="A one-line summary">
    </div>
    <div class="field">
      <label>Ingredients — one per line</label>
      <textarea id="f-ingredients" placeholder="1 kg beef, cubed&#10;2-4 inches ginger&#10;800g coconut milk"></textarea>
      <div class="hint">One ingredient per line.</div>
    </div>
    <div class="field">
      <label>Steps — one per line (optional)</label>
      <textarea id="f-steps" placeholder="Boil the beef for 1.5-2.5 hours&#10;Blend the spice paste&#10;Fry the paste in oil"></textarea>
      <div class="hint">One step per line, in order.</div>
    </div>
    <div class="field">
      <label>Notes (optional)</label>
      <textarea id="f-notes" placeholder="Tips, substitutions, storage advice..." style="min-height:60px;"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeAddModal()">Cancel</button>
      <button class="btn-primary" onclick="saveNewRecipe()">Save recipe</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="importModal">
  <div class="modal">
    <h2>Import recipes</h2>
    <p class="modal-note" id="importSummary"></p>
    <div class="modal-actions stack">
      <button class="btn-primary" onclick="applyImport('merge')">Merge — keep what I have</button>
      <button class="btn-secondary" onclick="applyImport('replace')">Replace everything</button>
      <button class="btn-secondary" onclick="closeImportModal()">Cancel</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Standalone storage shim — uses localStorage so this file works offline,
// outside Claude, and when saved to the iOS home screen.
window.storage = {
  async get(key) {
    const v = localStorage.getItem(key);
    if (v === null) throw new Error('not found');
    return { key, value: v };
  },
  async set(key, value) {
    localStorage.setItem(key, value);
    return { key, value };
  },
  async delete(key) {
    localStorage.removeItem(key);
    return { key, deleted: true };
  },
  async list(prefix = '') {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(prefix)) keys.push(k);
    }
    return { keys, prefix };
  }
};
</script>

async function loadRecipes() {
  try {
    const result = await window.storage.get(STORAGE_KEY, false);
    if (result && result.value) {
      recipes = JSON.parse(result.value);
    } else {
      recipes = DEFAULT_RECIPES;
      await persistRecipes();
    }
  } catch (e) {
    recipes = DEFAULT_RECIPES;
    try { await persistRecipes(); } catch (e2) { console.error('save failed', e2); }
  }

  try {
    const sel = await window.storage.get(SELECTED_KEY, false);
    if (sel && sel.value) {
      selectedForShopping = new Set(JSON.parse(sel.value));
    }
  } catch (e) { /* no selection saved yet */ }

  try {
    const chk = await window.storage.get(SHOP_CHECKED_KEY, false);
    if (chk && chk.value) {
      const obj = JSON.parse(chk.value);
      shoppingChecked = {};
      Object.keys(obj).forEach(k => shoppingChecked[k] = new Set(obj[k]));
    }
  } catch (e) { /* no checked state saved yet */ }

  render();
  renderShopping();
}

// Save with retries — the storage backend occasionally returns a transient error
async function safeSet(key, value) {
  const delays = [0, 400, 1200];
  for (let attempt = 0; attempt < delays.length; attempt++) {
    if (delays[attempt]) await new Promise(r => setTimeout(r, delays[attempt]));
    try {
      await window.storage.set(key, value, false);
      return true;
    } catch (e) {
      if (attempt === delays.length - 1) {
        console.error('Storage save failed after retries', key, e);
        return false;
      }
    }
  }
  return false;
}

function setSaveStatus(ok) {
  const el = document.getElementById('saveStatus');
  if (!el) return;
  if (ok) {
    el.style.display = 'none';
  } else {
    el.style.display = 'block';
    el.textContent = "Couldn't save just now — your changes are here for this session but may not persist. Try again in a moment.";
  }
}

async function persistSelected() {
  const ok = await safeSet(SELECTED_KEY, JSON.stringify([...selectedForShopping]));
  setSaveStatus(ok);
  return ok;
}

async function persistShoppingChecked() {
  const obj = {};
  Object.keys(shoppingChecked).forEach(k => obj[k] = [...shoppingChecked[k]]);
  const ok = await safeSet(SHOP_CHECKED_KEY, JSON.stringify(obj));
  setSaveStatus(ok);
  return ok;
}

function switchView(view) {
  document.getElementById('nav-recipes').classList.toggle('active', view === 'recipes');
  document.getElementById('nav-shopping').classList.toggle('active', view === 'shopping');
  document.getElementById('view-recipes').classList.toggle('active', view === 'recipes');
  document.getElementById('view-shopping').classList.toggle('active', view === 'shopping');
  if (view === 'shopping') renderShopping();
}

let persistTimer = null;
function schedulePersist() {
  clearTimeout(persistTimer);
  persistTimer = setTimeout(() => {
    persistSelected();
    persistShoppingChecked();
  }, 600);
}

function toggleRecipeSelected(id) {
  if (selectedForShopping.has(id)) selectedForShopping.delete(id);
  else selectedForShopping.add(id);
  renderShopping();
  schedulePersist();
}

function toggleShoppingItem(recipeId, idx) {
  if (!shoppingChecked[recipeId]) shoppingChecked[recipeId] = new Set();
  const set = shoppingChecked[recipeId];
  if (set.has(idx)) set.delete(idx); else set.add(idx);
  renderShopping();
  schedulePersist();
}

const CATEGORY_ORDER = ['Meat & Seafood', 'Produce', 'Dairy & Eggs', 'Pantry & Spices', 'Other'];

// --- Ingredient parsing for merging (shopping list only) ---

const UNIT_ALIASES = {
  'g': 'g', 'gram': 'g', 'grams': 'g',
  'kg': 'kg', 'kilo': 'kg', 'kilos': 'kg',
  'ml': 'ml', 'l': 'l', 'litre': 'l', 'liter': 'l',
  'tbsp': 'tbsp', 'tablespoon': 'tbsp', 'tablespoons': 'tbsp',
  'tsp': 'tsp', 'teaspoon': 'tsp', 'teaspoons': 'tsp',
  'cup': 'cup', 'cups': 'cup',
  'clove': 'clove', 'cloves': 'clove',
  'slice': 'slice', 'slices': 'slice',
  'inch': 'inch', 'inches': 'inch',
  'handful': 'handful', 'handfuls': 'handful',
  'bunch': 'bunch', 'bunches': 'bunch',
  'can': 'can', 'cans': 'can',
  'stick': 'stick', 'sticks': 'stick',
  'pinch': 'pinch'
};

function parseFraction(s) {
  s = s.trim();
  if (s.includes('/')) {
    const [a, b] = s.split('/').map(Number);
    if (b) return a / b;
  }
  if (s.includes('-') || s.includes('–')) {
    // range like "2-4" -> take the upper bound so you buy enough
    const parts = s.split(/[-–]/).map(Number).filter(n => !isNaN(n));
    if (parts.length) return Math.max(...parts);
  }
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function parseIngredient(text) {
  let rest = text.trim();
  // leading quantity: "1", "1/2", "2-4", "1 1/2"
  const qtyMatch = rest.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?(?:\s*[-–]\s*\d+(?:[.,]\d+)?)?)\s*/);
  let qty = null;
  if (qtyMatch) {
    const raw = qtyMatch[1].replace(',', '.');
    if (/^\d+\s+\d+\/\d+$/.test(raw)) {
      const [whole, frac] = raw.split(/\s+/);
      qty = Number(whole) + parseFraction(frac);
    } else {
      qty = parseFraction(raw);
    }
    rest = rest.slice(qtyMatch[0].length);
  }

  // unit right after the quantity
  let unit = null;
  const unitMatch = rest.match(/^([a-zA-Z]+)\.?\s+/);
  if (unitMatch) {
    const candidate = unitMatch[1].toLowerCase();
    if (UNIT_ALIASES[candidate]) {
      unit = UNIT_ALIASES[candidate];
      rest = rest.slice(unitMatch[0].length);
    }
  }

  return { qty, unit, name: rest.trim() };
}

// Reduce a name to a comparable key: drop parentheticals, purpose clauses, prep words
function normalizeName(name) {
  let n = name.toLowerCase();
  n = n.replace(/\([^)]*\)/g, ' ');              // (for initial cook)
  n = n.replace(/\b(for|to)\b[^,]*$/g, ' ');      // "for frying paste", "to taste"
  n = n.replace(/,.*$/, ' ');                     // ", cut into cubes"
  n = n.replace(/\b(fresh|large|small|medium|whole|about|approx|of|the|a|an)\b/g, ' ');
  n = n.replace(/\b(cubed|chopped|sliced|minced|grated|ground|dried|toasted)\b/g, ' ');
  n = n.replace(/[^a-z\s]/g, ' ');
  n = n.replace(/\s+/g, ' ').trim();
  // crude singularization
  n = n.split(' ').map(w => (w.length > 3 && w.endsWith('s') && !w.endsWith('ss')) ? w.slice(0, -1) : w).join(' ');
  return n;
}

function formatQty(n) {
  if (n === null) return '';
  const rounded = Math.round(n * 100) / 100;
  if (Number.isInteger(rounded)) return String(rounded);
  // render common fractions nicely
  const map = { 0.25: '¼', 0.5: '½', 0.75: '¾', 0.33: '⅓', 0.67: '⅔' };
  const whole = Math.floor(rounded);
  const frac = Math.round((rounded - whole) * 100) / 100;
  if (map[frac]) return whole > 0 ? `${whole}${map[frac]}` : map[frac];
  return String(rounded);
}

// Combine quantities: sum when units match (with g/kg and ml/l conversion), else list them
function combineQuantities(entries) {
  const withQty = entries.filter(e => e.qty !== null);
  if (withQty.length === 0) return '';

  // normalize weight and volume to a base unit
  const toBase = { g: ['g', 1], kg: ['g', 1000], ml: ['ml', 1], l: ['ml', 1000] };
  const buckets = {};
  let mixed = false;

  withQty.forEach(e => {
    const u = e.unit || '';
    if (toBase[u]) {
      const [base, factor] = toBase[u];
      buckets[base] = (buckets[base] || 0) + e.qty * factor;
    } else {
      buckets[u] = (buckets[u] || 0) + e.qty;
    }
  });

  const parts = Object.keys(buckets).map(u => {
    let val = buckets[u];
    let unit = u;
    if (u === 'g' && val >= 1000) { val = val / 1000; unit = 'kg'; }
    if (u === 'ml' && val >= 1000) { val = val / 1000; unit = 'l'; }
    return unit ? `${formatQty(val)} ${unit}` : formatQty(val);
  });

  return parts.join(' + ');
}

function buildMergedItems(included) {
  const groups = {};

  included.forEach(r => {
    const checkedSet = shoppingChecked[r.id] || new Set();
    r.ingredients.forEach((text, idx) => {
      const parsed = parseIngredient(text);
      const key = normalizeName(parsed.name) || text.toLowerCase();
      if (!groups[key]) {
        groups[key] = {
          key,
          displayName: parsed.name || text,
          entries: [],
          sources: [],
          refs: [],
          category: categorize(text)
        };
      }
      groups[key].entries.push(parsed);
      groups[key].refs.push({ recipeId: r.id, idx });
      if (!groups[key].sources.includes(r.title)) groups[key].sources.push(r.title);
      // a merged row counts as checked only when every underlying item is checked
      groups[key].allChecked = groups[key].refs.every(ref =>
        (shoppingChecked[ref.recipeId] || new Set()).has(ref.idx)
      );
    });
  });

  return Object.values(groups).map(g => {
    const qtyStr = combineQuantities(g.entries);
    return {
      key: g.key,
      label: qtyStr ? `${qtyStr} ${g.displayName}` : g.displayName,
      sources: g.sources,
      refs: g.refs,
      category: g.category,
      merged: g.refs.length > 1,
      checked: g.allChecked
    };
  });
}

function categorize(text) {
  const t = text.toLowerCase();
  const has = (...words) => words.some(w => t.includes(w));

  if (has('beef', 'pork', 'chicken', 'fish', 'shrimp', 'prawn', 'lamb', 'bacon', 'sausage', 'chop', 'steak', 'mince', 'meat')) {
    return 'Meat & Seafood';
  }
  if (has('milk', 'cheese', 'butter', 'cream', 'yogurt', 'egg')) {
    return 'Dairy & Eggs';
  }
  if (has('ginger', 'garlic', 'turmeric', 'chili', 'chilies', 'chilli', 'shallot', 'lemongrass',
          'scallion', 'onion', 'lime', 'lemon', 'tomato', 'lettuce', 'leaves', 'cabbage',
          'cilantro', 'coriander leaves', 'basil', 'coconut,', 'fresh coconut')) {
    return 'Produce';
  }
  if (has('sauce', 'sugar', 'salt', 'msg', 'starch', 'flour', 'oil', 'vinegar', 'paste',
          'spice', 'seed', 'cinnamon', 'cumin', 'coriander seeds', 'fennel', 'wine', 'stock',
          'broth', 'rice', 'noodle', 'coconut milk', 'pepper', 'water', 'maggi')) {
    return 'Pantry & Spices';
  }
  return 'Other';
}

function renderShopping() {
  const pickList = document.getElementById('pickList');
  if (recipes.length === 0) {
    pickList.innerHTML = `<div class="shop-empty">Add some recipes first, then pick which ones to shop for.</div>`;
    document.getElementById('shoppingList').innerHTML = '';
    return;
  }

  pickList.innerHTML = recipes.map(r => {
    const checked = selectedForShopping.has(r.id);
    return `<div class="pick-row">
      <div class="checkbox ${checked ? 'checked' : ''}" onclick="toggleRecipeSelected('${r.id}')">${checked ? '✓' : ''}</div>
      <div>
        <div class="rtitle">${escapeHtml(r.title)}</div>
        <div class="rcount">${r.ingredients.length} ingredients</div>
      </div>
    </div>`;
  }).join('');

  const included = recipes.filter(r => selectedForShopping.has(r.id));
  const shopEl = document.getElementById('shoppingList');

  if (included.length === 0) {
    shopEl.innerHTML = `<div class="shop-empty">Tick recipes above to build your combined shopping list.</div>`;
    return;
  }

  const items = buildMergedItems(included);

  const unchecked = items.filter(i => !i.checked)
    .sort((a, b) => a.label.localeCompare(b.label));
  const checked = items.filter(i => i.checked)
    .sort((a, b) => a.label.localeCompare(b.label));

  let html = '';

  CATEGORY_ORDER.forEach(cat => {
    const group = unchecked.filter(i => i.category === cat);
    if (group.length === 0) return;
    html += `<div class="shop-group">
      <div class="shop-group-title">${cat}</div>
      ${group.map(i => renderShopRow(i)).join('')}
    </div>`;
  });

  if (checked.length > 0) {
    html += `<div class="shop-group">
      <div class="shop-group-title" style="color: var(--ink-soft);">Checked off</div>
      ${checked.map(i => renderShopRow(i)).join('')}
    </div>`;
  }

  shopEl.innerHTML = html;
}

function renderShopRow(i) {
  const refsAttr = encodeURIComponent(JSON.stringify(i.refs));
  const sourceLine = i.merged
    ? `${i.sources.join(' + ')} · combined`
    : i.sources[0];
  return `<div class="ing-row">
    <div class="checkbox ${i.checked ? 'checked' : ''}" onclick="toggleMergedItem('${refsAttr}')">${i.checked ? '✓' : ''}</div>
    <div>
      <div class="ing-text ${i.checked ? 'checked' : ''}">${escapeHtml(i.label)}</div>
      <div class="rcount" style="margin-top:1px;">${escapeHtml(sourceLine)}</div>
    </div>
  </div>`;
}

function toggleMergedItem(refsAttr) {
  const refs = JSON.parse(decodeURIComponent(refsAttr));
  const allChecked = refs.every(r => (shoppingChecked[r.recipeId] || new Set()).has(r.idx));
  refs.forEach(r => {
    if (!shoppingChecked[r.recipeId]) shoppingChecked[r.recipeId] = new Set();
    if (allChecked) shoppingChecked[r.recipeId].delete(r.idx);
    else shoppingChecked[r.recipeId].add(r.idx);
  });
  renderShopping();
  schedulePersist();
}

async function persistRecipes() {
  // strip transient UI state before saving
  const clean = recipes.map(({ _open, ...rest }) => rest);
  const ok = await safeSet(STORAGE_KEY, JSON.stringify(clean));
  setSaveStatus(ok);
  return ok;
}

function render() {
  const list = document.getElementById('recipeList');
  if (recipes.length === 0) {
    list.innerHTML = `<div class="empty">
      <div class="big">🍲</div>
      <p>No recipes yet</p>
      <span>Add one to start your collection</span>
    </div>`;
    return;
  }

  list.innerHTML = recipes.map(r => {
    const isOpen = r._open;
    const hasSteps = r.steps && r.steps.length > 0;
    let tab = openTabs[r.id] || 'ingredients';
    if (tab === 'steps' && !hasSteps) tab = 'ingredients';
    const metaBits = [`${r.ingredients.length} ingredients`];
    if (hasSteps) metaBits.push(`${r.steps.length} steps`);
    return `
    <div class="recipe-card ${isOpen ? 'open' : ''}" id="card-${r.id}">
      <div class="recipe-head" onclick="toggleCard('${r.id}')">
        <div class="recipe-head-text">
          <div class="recipe-title">${escapeHtml(r.title)}</div>
          <div class="recipe-meta">${metaBits.map(m => `<span>${m}</span>`).join('')}</div>
        </div>
        <div class="chevron">⌄</div>
      </div>
      <div class="recipe-body">
        ${r.description ? `<p class="desc">${escapeHtml(r.description)}</p>` : ''}
        <div class="tabs">
          <button class="tab-btn ${tab === 'ingredients' ? 'active' : ''}" onclick="switchTab(event,'${r.id}','ingredients')">Ingredients</button>
          ${hasSteps ? `<button class="tab-btn ${tab === 'steps' ? 'active' : ''}" onclick="switchTab(event,'${r.id}','steps')">Steps</button>` : ''}
          ${r.notes ? `<button class="tab-btn ${tab === 'notes' ? 'active' : ''}" onclick="switchTab(event,'${r.id}','notes')">Notes</button>` : ''}
        </div>
        <div class="pane ${tab === 'ingredients' ? 'active' : ''}">
          ${r.ingredients.map((ing, i) => {
            const checked = (checkedIngredients[r.id] || new Set()).has(i);
            return `<div class="ing-row">
              <div class="checkbox ${checked ? 'checked' : ''}" onclick="event.stopPropagation(); toggleIngredient('${r.id}', ${i})">${checked ? '✓' : ''}</div>
              <div class="ing-text ${checked ? 'checked' : ''}">${escapeHtml(ing)}</div>
            </div>`;
          }).join('')}
        </div>
        ${hasSteps ? `<div class="pane ${tab === 'steps' ? 'active' : ''}">
          ${r.steps.map((s, i) => `<div class="step-row">
            <div class="step-num">${i+1}</div>
            <div class="step-text">${escapeHtml(s)}</div>
          </div>`).join('')}
        </div>` : ''}
        ${r.notes ? `<div class="pane ${tab === 'notes' ? 'active' : ''}">
          <div class="notes-box"><span class="lbl">Notes</span>${escapeHtml(r.notes)}</div>
        </div>` : ''}
        <div class="card-actions">
          <button class="del-btn" onclick="event.stopPropagation(); deleteRecipe('${r.id}')">Remove recipe</button>
        </div>
      </div>
    </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function toggleCard(id) {
  const r = recipes.find(x => x.id === id);
  r._open = !r._open;
  render();
}

function switchTab(e, id, tabName) {
  e.stopPropagation();
  openTabs[id] = tabName;
  render();
}

function toggleIngredient(id, idx) {
  if (!checkedIngredients[id]) checkedIngredients[id] = new Set();
  const set = checkedIngredients[id];
  if (set.has(idx)) set.delete(idx); else set.add(idx);
  render();
}

async function deleteRecipe(id) {
  recipes = recipes.filter(r => r.id !== id);
  selectedForShopping.delete(id);
  delete shoppingChecked[id];
  await persistRecipes();
  await persistSelected();
  await persistShoppingChecked();
  render();
  renderShopping();
}

function openAddModal() {
  document.getElementById('modalOverlay').classList.add('open');
}
function closeAddModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  ['f-title','f-desc','f-ingredients','f-steps','f-notes'].forEach(id => document.getElementById(id).value = '');
}

async function saveNewRecipe() {
  const title = document.getElementById('f-title').value.trim();
  const desc = document.getElementById('f-desc').value.trim();
  const ingredientsRaw = document.getElementById('f-ingredients').value.trim();
  const stepsRaw = document.getElementById('f-steps').value.trim();
  const notes = document.getElementById('f-notes').value.trim();

  if (!title || !ingredientsRaw) {
    alert('Please fill in a title and at least one ingredient.');
    return;
  }

  const newRecipe = {
    id: 'r-' + Date.now(),
    title,
    description: desc,
    ingredients: ingredientsRaw.split('\n').map(s => s.trim()).filter(Boolean),
    steps: stepsRaw.split('\n').map(s => s.trim()).filter(Boolean),
    notes: notes || ''
  };

  recipes.unshift(newRecipe);
  await persistRecipes();
  closeAddModal();
  render();
  renderShopping();
}

// ---------------------------------------------------------------------------
// Export / import
//
// Two different jobs, deliberately kept apart:
//   - the shopping list exports as plain text, to hand to a person
//   - recipes export as JSON, to hand back to this app on another device
// ---------------------------------------------------------------------------

const BACKUP_VERSION = 1;

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

function stamp() {
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

function downloadFile(filename, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// --- Recipes → JSON backup ---

function exportRecipes() {
  if (recipes.length === 0) { toast('No recipes to export yet'); return; }
  const payload = {
    app: 'recipe-box',
    version: BACKUP_VERSION,
    exported: new Date().toISOString(),
    recipes: recipes.map(({ _open, ...rest }) => rest)   // _open is never persisted
  };
  downloadFile(`recipe-box-backup-${stamp()}.json`, JSON.stringify(payload, null, 2), 'application/json');
  toast(`Exported ${recipes.length} recipe${recipes.length === 1 ? '' : 's'}`);
}

// --- Shopping list → plain text ---

function buildShoppingText() {
  const included = recipes.filter(r => selectedForShopping.has(r.id));
  if (included.length === 0) return null;

  const items = buildMergedItems(included);
  const byLabel = (a, b) => a.label.localeCompare(b.label);
  const lines = [
    'SHOPPING LIST',
    `${new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })} · ${included.length} recipe${included.length === 1 ? '' : 's'}`,
    ''
  ];

  // same grouping and ordering the on-screen list uses
  CATEGORY_ORDER.forEach(cat => {
    const group = items.filter(i => !i.checked && i.category === cat).sort(byLabel);
    if (group.length === 0) return;
    lines.push(cat.toUpperCase());
    group.forEach(i => lines.push(`- ${i.label}`));
    lines.push('');
  });

  const done = items.filter(i => i.checked).sort(byLabel);
  if (done.length > 0) {
    lines.push('ALREADY GOT');
    done.forEach(i => lines.push(`- ${i.label}`));
    lines.push('');
  }

  lines.push(`From: ${included.map(r => r.title).join(', ')}`);
  return lines.join('\n');
}

async function exportShoppingList() {
  const text = buildShoppingText();
  if (!text) { toast('Tick some recipes first'); return; }

  // On iOS this opens the native share sheet — Messages, Notes, WhatsApp.
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Shopping List', text });
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // user dismissed the sheet
      // anything else: fall through to copy
    }
  }

  try {
    await navigator.clipboard.writeText(text);
    toast('Shopping list copied');
    return;
  } catch (e) {
    // clipboard needs a secure context; opening the file directly won't have one
  }

  downloadFile(`shopping-list-${stamp()}.txt`, text, 'text/plain');
  toast('Shopping list downloaded');
}

// --- JSON backup → recipes ---

let pendingImport = null;

function openImportPicker() {
  document.getElementById('importFile').click();
}

function isUsableRecipe(r) {
  return r && typeof r === 'object'
    && typeof r.title === 'string' && r.title.trim()
    && Array.isArray(r.ingredients) && r.ingredients.length > 0;
}

function normalizeImported(r) {
  const str = v => (typeof v === 'string' ? v.trim() : '');
  const list = v => (Array.isArray(v) ? v.map(x => String(x).trim()).filter(Boolean) : []);
  return {
    id: str(r.id) || `r-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
    title: r.title.trim(),
    description: str(r.description),
    ingredients: list(r.ingredients),
    steps: list(r.steps),
    notes: str(r.notes)
  };
}

async function handleImportFile(input) {
  const file = input.files && input.files[0];
  input.value = '';   // so picking the same file twice still fires onchange
  if (!file) return;

  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    alert("That file isn't valid JSON. Pick a Recipe Box backup file (recipe-box-backup-….json).");
    return;
  }

  // accept both our wrapper and a bare array of recipes
  const incoming = Array.isArray(data) ? data : (data && data.recipes);
  if (!Array.isArray(incoming)) {
    alert("Couldn't find any recipes in that file.");
    return;
  }

  const usable = incoming.filter(isUsableRecipe).map(normalizeImported);
  if (usable.length === 0) {
    alert('No usable recipes in that file — each one needs a title and at least one ingredient.');
    return;
  }

  pendingImport = usable;
  const dropped = incoming.length - usable.length;
  document.getElementById('importSummary').innerHTML =
    `Found <strong>${usable.length} recipe${usable.length === 1 ? '' : 's'}</strong> in that file` +
    (dropped > 0 ? `, and skipped ${dropped} with no title or ingredients` : '') +
    `. You currently have <strong>${recipes.length}</strong>.<br><br>` +
    `Merge adds the ones you don't already have. Replace deletes your current ${recipes.length} and uses the file instead.`;
  document.getElementById('importModal').classList.add('open');
}

function closeImportModal() {
  document.getElementById('importModal').classList.remove('open');
  pendingImport = null;
}

async function applyImport(mode) {
  const incoming = pendingImport;
  if (!incoming) { closeImportModal(); return; }

  if (mode === 'replace' &&
      !confirm(`Delete your current ${recipes.length} recipes and replace them with the ${incoming.length} from this file? This can't be undone.`)) {
    return;
  }

  document.getElementById('importModal').classList.remove('open');
  pendingImport = null;

  let added = 0, skipped = 0;

  if (mode === 'replace') {
    recipes = incoming;
    // drop selection and tick state pointing at recipes that no longer exist
    const liveIds = new Set(recipes.map(r => r.id));
    selectedForShopping = new Set([...selectedForShopping].filter(id => liveIds.has(id)));
    Object.keys(shoppingChecked).forEach(id => { if (!liveIds.has(id)) delete shoppingChecked[id]; });
    checkedIngredients = {};
    openTabs = {};
    added = incoming.length;
  } else {
    // match on id first, then title — there's no edit feature, so a repeat
    // title is a re-import rather than a revision
    const haveIds = new Set(recipes.map(r => r.id));
    const haveTitles = new Set(recipes.map(r => r.title.trim().toLowerCase()));
    incoming.forEach(r => {
      const titleKey = r.title.toLowerCase();
      if (haveIds.has(r.id) || haveTitles.has(titleKey)) { skipped++; return; }
      haveIds.add(r.id);
      haveTitles.add(titleKey);
      recipes.unshift(r);
      added++;
    });
  }

  await persistRecipes();
  await persistSelected();
  await persistShoppingChecked();
  render();
  renderShopping();

  toast(mode === 'replace'
    ? `Replaced — ${added} recipe${added === 1 ? '' : 's'} loaded`
    : `Added ${added}${skipped > 0 ? `, skipped ${skipped} you already had` : ''}`);
}

loadRecipes();
</script>
